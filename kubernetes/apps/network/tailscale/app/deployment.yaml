---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale
    spec:
      serviceAccountName: tailscale
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/tailscale/tailscale:v1.98.10
          env:
            - name: TS_HOSTNAME
              value: home-ops
            - name: TS_USERSPACE
              value: "true"
            - name: TS_KUBE_SECRET
              value: tailscale-state
            - name: TS_ROUTES
              value: 10.0.50.0/24
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-secret
                  key: TS_AUTHKEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
