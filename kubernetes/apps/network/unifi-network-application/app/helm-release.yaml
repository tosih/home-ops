---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-network-application
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    controllers:
      unifi-network-application:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          build-p12:
            image:
              repository: alpine/openssl
              tag: "3.5.8"
            command:
              - sh
              - -c
              - |
                openssl pkcs12 -export \
                  -in /tls/tls.crt \
                  -inkey /tls/tls.key \
                  -name unifi \
                  -out /shared/unifi.p12 \
                  -passout pass:aircontrolenterprise
          import-keystore:
            image:
              repository: eclipse-temurin
              tag: 25-jre-alpine
            command:
              - sh
              - -c
              - |
                mkdir -p /config/data
                rm -f /config/data/keystore
                keytool -importkeystore \
                  -deststorepass aircontrolenterprise \
                  -destkeypass aircontrolenterprise \
                  -destkeystore /config/data/keystore \
                  -srckeystore /shared/unifi.p12 \
                  -srcstoretype PKCS12 \
                  -srcstorepass aircontrolenterprise \
                  -alias unifi \
                  -noprompt
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/unifi-network-application
              tag: "10.6.101"
            env:
              PUID: "568"
              PGID: "568"
              TZ: America/Los_Angeles
              MONGO_HOST: unifi-network-application-mongodb
              MONGO_PORT: "27017"
              MONGO_DBNAME: unifi
              MONGO_AUTHSOURCE: admin
              MEM_LIMIT: "1024"
              MEM_STARTUP: "1024"
            envFrom:
              - secretRef:
                  name: unifi-network-application-mongo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8443
                  initialDelaySeconds: 90
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8443
                  initialDelaySeconds: 90
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8443
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

      mongodb:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: mongo
              tag: "7.0"
            envFrom:
              - secretRef:
                  name: unifi-network-application-mongo-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 27017
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 27017
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: unifi-network-application
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "10.0.50.110"
          external-dns.alpha.kubernetes.io/hostname: "unifi.${SECRET_DOMAIN}"
        ports:
          https:
            port: 8443
            primary: true
          inform:
            enabled: true
            port: 8080
          stun:
            enabled: true
            port: 3478
            protocol: UDP
          discovery:
            enabled: true
            port: 10001
            protocol: UDP
          portal-http:
            enabled: true
            port: 8880
          portal-https:
            enabled: true
            port: 8843
          speedtest:
            enabled: true
            port: 6789
      mongodb:
        controller: mongodb
        ports:
          mongodb:
            port: 27017

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: unifi-network-application-config-longhorn
        advancedMounts:
          unifi-network-application:
            app:
              - path: /config
            import-keystore:
              - path: /config
      tls-cert:
        enabled: true
        type: secret
        name: unifi-network-application-tls
        advancedMounts:
          unifi-network-application:
            build-p12:
              - path: /tls
                readOnly: true
      tls-p12:
        enabled: true
        type: emptyDir
        advancedMounts:
          unifi-network-application:
            build-p12:
              - path: /shared
            import-keystore:
              - path: /shared
      mongodb-data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: unifi-network-application-mongodb-longhorn
        advancedMounts:
          mongodb:
            app:
              - path: /data/db
