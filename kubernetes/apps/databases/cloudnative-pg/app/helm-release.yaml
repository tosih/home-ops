---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: false
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      create: true
    replicaCount: 1
    resources:
      requests:
        cpu: 15m
        memory: 128Mi
      limits:
        memory: 256Mi
    # monitoring:
    #   podMonitorEnabled: true
    #   grafanaDashboard:
    #     create: true
