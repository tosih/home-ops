---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      qbittorrent:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          nodeSelector:
            node-role.kubernetes.io/worker: ""
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3
            env:
              TZ: America/Los_Angeles
              # qbittorrent-nox reads QBT_<OPTION> (see `qbittorrent-nox --help`); the image's
              # entrypoint ignores the old QBITTORRENT__* names, so the saved config's
              # Session\Port=6881 won
              QBT_WEBUI_PORT: &port 8080
              QBT_TORRENTING_PORT: &bt-port 50413

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 15m
                memory: 100Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
      bittorrent:
        controller: qbittorrent
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.50.103
        ports:
          bittorrent-tcp:
            port: *bt-port
            protocol: TCP
          bittorrent-udp:
            port: *bt-port
            protocol: UDP

    route:
      app:
        annotations:
        hostnames: ["qbittorrent.tosih.org"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: qbittorrent-longhorn
        advancedMounts:
          qbittorrent:
            app:
              - path: /config

      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media-nfs
        advancedMounts:
          qbittorrent:
            app:
              - path: /media

      downloads:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: downloads-zfs
        advancedMounts:
          qbittorrent:
            app:
              - path: /downloads
