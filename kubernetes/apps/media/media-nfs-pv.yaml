---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # NFSv4.2 server-side COPY hangs qBittorrent's move thread (nfs42_proc_copy);
  # 4.1 has no COPY, so the client falls back to a normal read/write copy.
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.0.0.2
    path: /mnt/data/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Ti
  volumeName: media-nfs-pv
